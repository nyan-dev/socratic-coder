<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-label="Stage 4 triage: what kind of failure routes to which fix">
  <title>Socratic Coder triage</title>
  <defs>
    <marker id="arw" markerWidth="12" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#4ED9C4"/>
    </marker>
  </defs>

  <rect width="880" height="500" fill="#1E1B3E"/>

  <!-- stray pixels, echoing the banner sparkle -->
  <rect x="60" y="60" width="6" height="6" fill="#4ED9C4" opacity="0.5"/>
  <rect x="120" y="410" width="5" height="5" fill="#F2D49B" opacity="0.4"/>
  <rect x="800" y="80" width="6" height="6" fill="#F2D49B" opacity="0.5"/>
  <rect x="840" y="430" width="5" height="5" fill="#4ED9C4" opacity="0.4"/>
  <rect x="30" y="240" width="4" height="4" fill="#8F88C9" opacity="0.5"/>
  <rect x="850" y="260" width="4" height="4" fill="#8F88C9" opacity="0.5"/>

  <g font-family="ui-monospace, 'Cascadia Mono', 'Courier New', monospace" text-anchor="middle">
    <!-- stage 3 -->
    <rect x="280" y="36" width="320" height="84" fill="#2A2456" stroke="#E8814E" stroke-width="3"/>
    <text x="440" y="74" font-size="16" font-weight="bold" fill="#F5E3C0">STAGE 3 · BREAK IT ON PURPOSE</text>
    <text x="440" y="100" font-size="14" fill="#9C96C8">the naive rule fails on real input</text>

    <line x1="440" y1="120" x2="440" y2="164" stroke="#8F88C9" stroke-width="2.5" marker-end="url(#arw)"/>

    <!-- decision -->
    <rect x="305" y="170" width="270" height="56" fill="#24304F" stroke="#4ED9C4" stroke-width="3"/>
    <text x="440" y="204" font-size="15" font-weight="bold" fill="#4ED9C4">WHAT KIND OF FAILURE?</text>

    <path d="M440,226 V266 H160 V306" fill="none" stroke="#8F88C9" stroke-width="2.5" marker-end="url(#arw)"/>
    <path d="M440,226 V306" fill="none" stroke="#8F88C9" stroke-width="2.5" marker-end="url(#arw)"/>
    <path d="M440,226 V266 H720 V306" fill="none" stroke="#8F88C9" stroke-width="2.5" marker-end="url(#arw)"/>

    <!-- branch 1 -->
    <rect x="28" y="312" width="264" height="152" fill="#2A2456" stroke="#8F88C9" stroke-width="2"/>
    <text x="160" y="342" font-size="13" font-weight="bold" fill="#4ED9C4">VARIATION THE RULE</text>
    <text x="160" y="362" font-size="13" font-weight="bold" fill="#4ED9C4">CANNOT ENUMERATE</text>
    <text x="160" y="394" font-size="14" fill="#F5E3C0">record a dataset,</text>
    <text x="160" y="414" font-size="14" fill="#F5E3C0">train a small classifier</text>
    <text x="160" y="442" font-size="12.5" fill="#9C96C8">scikit-learn before PyTorch</text>

    <!-- branch 2 -->
    <rect x="308" y="312" width="264" height="152" fill="#2A2456" stroke="#8F88C9" stroke-width="2"/>
    <text x="440" y="342" font-size="13" font-weight="bold" fill="#4ED9C4">A BUG: BAD STRUCTURE,</text>
    <text x="440" y="362" font-size="13" font-weight="bold" fill="#4ED9C4">MISSING CHECK, OFF-BY-ONE</text>
    <text x="440" y="394" font-size="14" fill="#F5E3C0">fix the algorithm</text>
    <text x="440" y="422" font-size="12.5" fill="#9C96C8">a model would teach</text>
    <text x="440" y="440" font-size="12.5" fill="#9C96C8">the wrong lesson</text>

    <!-- branch 3 -->
    <rect x="588" y="312" width="264" height="152" fill="#2A2456" stroke="#8F88C9" stroke-width="2"/>
    <text x="720" y="342" font-size="13" font-weight="bold" fill="#4ED9C4">THE REQUIREMENT</text>
    <text x="720" y="362" font-size="13" font-weight="bold" fill="#4ED9C4">WAS NEVER REAL</text>
    <text x="720" y="394" font-size="14" fill="#F5E3C0">no fix, and say so</text>
    <text x="720" y="422" font-size="12.5" fill="#9C96C8">nothing needs to be smarter</text>
  </g>
</svg>
